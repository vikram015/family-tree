<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kinvia" />

    <!-- Primary Meta Tags -->
    <title>Kinvia – Your Family Tree, Celebrations &amp; Family Business Directory</title>
    <meta
      name="title"
      content="Kinvia – Your Family Tree, Celebrations &amp; Family Business Directory"
    />
    <meta
      name="description"
      content="Build your family tree together with relatives, link yourself to your own profile, and keep everyone close: birthdays, anniversaries and remembrances, family businesses and careers, photos, and village family trees. Free, in English and Hindi."
    />
    <meta
      name="keywords"
      content="family tree, family tree maker, Indian family tree, वंशावली, परिवार वृक्ष, family tree in Hindi, gotra, village family tree, family birthdays and anniversaries, family business directory, family professions, genealogy, ancestry, lineage, free family tree app"
    />
    <meta name="author" content="Kinvia" />
    <meta name="robots" content="index, follow" />
    <!-- No static canonical / og:url: every route is served from this file, so
         a fixed "https://kinvia.in/" here told search engines every page was a
         copy of the home page. The app sets both per page (see App.tsx). -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Kinvia – Your Family Tree, Celebrations &amp; Family Business Directory"
    />
    <meta
      property="og:description"
      content="Build your family tree together with relatives, link yourself to your own profile, and keep everyone close: birthdays, anniversaries and remembrances, family businesses and careers, photos, and village family trees. Free, in English and Hindi."
    />
    <!-- Must be a file that actually exists in public/: the SPA catch-all rewrite
         answers missing paths with index.html (200 text/html), so a wrong path
         here silently gives Facebook an HTML body instead of an image. -->
    <meta property="og:image" content="https://kinvia.in/logo512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="hi_IN" />
    <meta property="og:site_name" content="Kinvia" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://kinvia.in/" />
    <meta
      name="twitter:title"
      content="Kinvia – Your Family Tree, Celebrations &amp; Family Business Directory"
    />
    <meta
      name="twitter:description"
      content="Build your family tree together with relatives, link yourself to your own profile, and keep everyone close: birthdays, anniversaries and remembrances, family businesses and careers, photos, and village family trees. Free, in English and Hindi."
    />
    <meta name="twitter:image" content="https://kinvia.in/logo512.png" />

    <!-- Additional SEO Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kinvia" />

    <!-- One stylesheet request for every family the app uses:
         - Inter: the UI typeface, from the product design.
         - Newsreader: the one serif, used for the dashboard's italic line.
         - Manrope: tree node cards, which draw their own SVG text.
         - Noto Sans Devanagari: Hindi names.
         Kept as a single <link> so the extra families cost no extra round trip,
         and `display=swap` so text paints immediately in the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data / JSON-LD -->
    <!-- Structured data. No aggregateRating: a rating with no real reviews
         behind it is a "self-serving review" under Google's rules, and can cost
         the site its rich results. Add one only from genuine, visible reviews. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Kinvia",
        "url": "https://kinvia.in/",
        "description": "Build your family tree together with relatives, link yourself to your own profile, and keep everyone close: birthdays, anniversaries and remembrances, family businesses and careers, photos, and village family trees.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any (web, Android, iPhone)",
        "inLanguage": ["en", "hi"],
        "image": "https://kinvia.in/logo512.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "featureList": [
          "Shared, interactive family tree that relatives build together",
          "Invite family members and link your account to your own profile",
          "Birthdays, anniversaries and remembrances with family wishes",
          "Family business and profession directory",
          "Family photo albums",
          "Explore family trees by village",
          "Names in English and Hindi",
          "Installable app for phones"
        ],
        "publisher": {
          "@type": "Organization",
          "name": "Kinvia",
          "url": "https://kinvia.in/",
          "logo": "https://kinvia.in/logo512.png"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
